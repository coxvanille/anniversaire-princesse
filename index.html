<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pour Ma Princesse ❤</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Lecteur de musique fixe avec contrôle du volume -->
    <div id="music-player">
        <audio id="bg-music" src="musique.mp3" loop></audio>
        <button id="btn-music" class="music-btn">🎵 Play</button>
        <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.05" value="0.5">
    </div>

    <!-- Arrière-plan animé avec cœurs flottants -->
    <div id="hearts-bg"></div>

    <!-- Étape 1 : La question piège -->
    <div id="quiz-container" class="full-screen">
        <div class="content glass-card">
            <span class="heart-badge">❤️</span>
            <h1>Est-ce que tu m'aimes ?</h1>
            <div class="btn-group">
                <button id="btn-oui" class="btn btn-glow">OUI 💕</button>
                <div class="btn-non-wrapper">
                    <button id="btn-non" class="btn">NON</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Étape 2 : Le Mini-Jeu QCM -->
    <div id="qcm-container" class="full-screen hidden">
        <div class="content glass-card qcm-card">
            <div class="qcm-progress" id="qcm-progress">Question 1 / 3</div>
            <h2 id="qcm-question">Question ici...</h2>
            <div id="qcm-options" class="options-grid"></div>
            <p id="qcm-feedback" class="feedback-msg"></p>
        </div>
    </div>

    <!-- Étape 2.5 : Galerie Photo Intermédiaire -->
    <div id="gallery-container" class="full-screen hidden">
        <div class="content glass-card gallery-card">
            <span class="heart-badge">✨</span>
            <h2>Galerie photo de la meilleure des copines ❤️</h2>
            
            <div class="photo-viewer">
                <img id="gallery-img" src="" alt="Souvenir">
            </div>

            <div class="gallery-controls">
                <button id="btn-prev-photo" class="btn">← Précédent</button>
                <button id="btn-next-photo" class="btn btn-glow">Suivant →</button>
            </div>
            
            <button id="btn-skip-gallery" class="btn-link">Découvrir les 100 raisons ❤️</button>
        </div>
    </div>

    <!-- Étape 3 : Le message final, le compteur et les 100 raisons -->
    <div id="main-content" class="hidden">
        <header class="birthday-header">
            <div class="header-badge">❤️ JOYEUX ANNIVERSAIRE ❤️</div>
            <h1>Joyeux Anniversaire Ma Princesse !</h1>
            <p class="subtitle">Voici 100 raisons (parmi tant d'autres) pour lesquelles tu es l'amour de ma vie...</p>
            
            <!-- Compteur de temps ensemble -->
            <div class="timer-card glass-card">
                <h3>Ensemble depuis :</h3>
                <div id="love-timer" class="timer-grid">
                    <div class="timer-item"><span id="days">0</span><label>Jours</label></div>
                    <div class="timer-item"><span id="hours">0</span><label>Heures</label></div>
                    <div class="timer-item"><span id="minutes">0</span><label>Min</label></div>
                    <div class="timer-item"><span id="seconds">0</span><label>Sec</label></div>
                </div>
            </div>
        </header>

        <section class="reasons-section">
            <div id="reasons-list" class="reasons-grid"></div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
